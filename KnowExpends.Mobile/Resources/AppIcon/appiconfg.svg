        <ellipse cx="228" cy="338" rx="120" ry="34" fill="rgba(0,0,0,0.18)"/>

        <!-- Stand -->
        <path d="M140 320c0-18 16-30 36-30h104c20 0 36 12 36 30v20H140v-20z" fill="#2f1a66"/>
        <path d="M140 332h176" stroke="#000" stroke-opacity="0.15" stroke-width="6"/>

        <!-- Glass sphere -->
        <defs>
            <radialGradient id="glass" cx="35%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
                <stop offset="60%" stop-color="#ffffff" stop-opacity="0.35"/>
                <stop offset="100%" stop-color="#ffffff" stop-opacity="0.18"/>
            </radialGradient>
        </defs>
        <circle cx="228" cy="220" r="120" fill="url(#glass)"/>
        <circle cx="228" cy="220" r="118" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="6"/>

        <!-- Dollar sign -->
        <g transform="translate(228,210)">
            <path d="M0 -70v140" stroke="#6b39ff" stroke-width="16"/>
            <path d="M-42 -32c0-20 18-32 42-32 24 0 42-10 42-30 0-20-18-32-42-32-14 0-26 3-36 9" fill="none" stroke="#6b39ff" stroke-width="16"/>
            <path d="M42 28c0 20-18 32-42 32-24 0-42 10-42 30 0 20 18 32 42 32 14 0 26-3 36-9" fill="none" stroke="#6b39ff" stroke-width="16"/>
        </g>

        <!-- Sparkles -->
        <g fill="#ffffff">
            <path d="M340 126l6 14 14 6-14 6-6 14-6-14-14-6 14-6 6-14z" fill-opacity="0.9"/>
            <path d="M112 146l4 10 10 4-10 4-4 10-4-10-10-4 10-4 4-10z" fill-opacity="0.9"/>
            <path d="M320 182l3 8 8 3-8 3-3 8-3-8-8-3 8-3 3-8z" fill-opacity="0.9"/>
        </g>
